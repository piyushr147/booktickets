spring.application.name=booktickets
server.port=${PORT:8080}
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:20000}
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:20000}
spring.threads.virtual.enabled=true

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/booktickets}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=2000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

app.jwt.secret=9f3c8a71d2e54b6fa1c93e87d45a0b62
app.token-mint.user-secret=${USER_TOKEN_MINT_SECRET:}
app.token-mint.admin-secret=${ADMIN_TOKEN_MINT_SECRET:}
app.metrics.cache-interval-ms=1000
app.booking.max-seats-per-request=50

logging.structured.format.console=logstash
spring.jackson.deserialization.fail-on-unknown-properties=false